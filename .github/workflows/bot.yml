name: Run Telegram Bot

on:
  schedule:
    # هر ۵ ساعت و ۵۰ دقیقه یک بار اجرا/ری‌استارت می‌شه
    # (چون هر job روی GitHub Actions حداکثر ~۶ ساعت مجازه)
    - cron: "0 */6 * * *"
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # چیزی کمتر از سقف ۶ ساعته‌ی گیت‌هاب
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python instagram_bot.py
